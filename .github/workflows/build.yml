name: build

on:
  push:
    tags: ['v*']          # пуш тега vX.Y.Z -> соберётся и выложится релиз
  workflow_dispatch:       # ручной запуск из вкладки Actions
    inputs:
      version:
        description: 'Версия (например 1.0.0)'
        default: '0.0.0-dev'
      release:
        description: 'Создать релиз в Releases (иначе только артефакт)'
        type: boolean
        default: false
      activation_url:
        description: 'URL /activation контрол-плейна для запекания стартовых маршрутов. Пусто → переменная ACTIVATION_URL, иначе seed из репозитория.'
        default: ''

permissions:
  contents: write           # нужно, чтобы создать релиз и приложить setup.exe

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'   # amnezia-box go.mod requires go 1.25

      - name: Версия
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            $v = $tag.TrimStart('v')
          } else {
            $v = '${{ github.event.inputs.version }}'
            if (-not $v) { $v = '0.0.0-dev' }
            $tag = "v$v"
          }
          $num = $v -replace '-.*$',''          # числовая часть для AssemblyVersion (0.0.0-dev -> 0.0.0)
          if (-not $num) { $num = '0.0.0' }
          "version=$v"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "numver=$num"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Версия сборки: $v (числовая $num, тег $tag)"

      # Запекаем ТЕКУЩИЕ маршруты активации в exe (встроенный ресурс). На них клиент строит первый
      # туннель на заблокированной сети, затем по туннелю тянет свою подписку. Берём из /activation
      # контрол-плейна — «маршруты изменились → пересобрал», без ручной правки; если эндпойнт не
      # задан/недоступен, остаётся seed из репозитория.
      - name: Запечь маршруты активации (seed)
        shell: pwsh
        env:
          ACTIVATION_URL: ${{ github.event.inputs.activation_url || vars.ACTIVATION_URL }}
        run: |
          $seed = "assets/activation_seed.txt"
          $url = $env:ACTIVATION_URL
          if ([string]::IsNullOrWhiteSpace($url)) {
            Write-Host "::notice::ACTIVATION_URL не задан — seed из репозитория."
          } else {
            try { $body = (Invoke-WebRequest -Uri $url -TimeoutSec 20 -UseBasicParsing).Content } catch { $body = "" }
            $t = if ($body) { $body.TrimStart() } else { "" }
            if ($body -and -not $t.StartsWith("<")) {
              $lines = ($body -split "`r?`n") | Where-Object { $_.Trim().Length -gt 0 }
              $header = "# QartzVPN activation routes — запечены при сборке из /activation.`n# Auto-generated by CI; do not hand-edit.`n"
              Set-Content -Path $seed -Value ($header + ($lines -join "`n")) -Encoding utf8
              Write-Host "::notice::Seed обновлён из контрол-плейна ($($lines.Count) строк)."
            } else {
              Write-Host "::warning::/activation недоступен или вернул пусто/HTML — seed из репозитория."
            }
          }

      - name: Сборка приложения
        shell: pwsh
        run: >
          dotnet publish QarttzVPN.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:Version=${{ steps.ver.outputs.numver }} -o publish

      - name: Скачать ядра xray и sing-box
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force publish\core | Out-Null

          # --- Xray-core (последний релиз) ---
          $xrayTag = gh api repos/XTLS/Xray-core/releases/latest --jq .tag_name
          Write-Host "Xray: $xrayTag"
          curl.exe -fL -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/$xrayTag/Xray-windows-64.zip"
          Expand-Archive xray.zip -DestinationPath xray -Force
          Copy-Item xray\xray.exe publish\core\xray.exe -Force

          # --- sing-box: AWG-capable, built from the Amnezia fork with -tags with_awg ---
          # Upstream sing-box rejects AWG, so we build sing-box.exe from amnezia-box (the fork that
          # adds the `awg` endpoint). The desktop runs it as a child process, so no API changes.
          git clone --branch master --depth 1 https://github.com/amnezia-vpn/amnezia-box amnezia-box
          Push-Location amnezia-box
          # Tags matter: a bare `with_awg` drops the stock release tags, so the TUN loses its gVisor
          # stack ("gVisor is not included in this build") and hysteria2 loses QUIC. gVisor is also
          # what the AWG endpoint's own netstack dials through. Keep all three.
          go build -tags "with_gvisor,with_quic,with_awg" -trimpath -ldflags "-s -w" -o "$pwd\..\publish\core\sing-box.exe" ./cmd/sing-box
          Pop-Location
          $sbTag = "amnezia-box@master (with_gvisor,with_quic,with_awg)"
          Write-Host "sing-box: $sbTag"

          "Xray $xrayTag`nsing-box $sbTag" | Out-File -Encoding utf8 publish\core\VERSIONS.txt
          Get-ChildItem publish\core

      - name: Установить Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Собрать установщик
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.ver.outputs.version }} installer\QarttzVPN.iss

      - name: Сгенерировать version.json
        shell: pwsh
        run: |
          $meta = [ordered]@{
            version = '${{ steps.ver.outputs.numver }}'
            url     = 'https://github.com/qarttz-creator/qartzvpn/releases/download/desktop-latest/QarttzVPN-Setup.exe'
          }
          $meta | ConvertTo-Json | Out-File -Encoding utf8 installer\output\version.json
          Get-Content installer\output\version.json

      - name: Выложить артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: QarttzVPN-Setup
          path: installer\output\QarttzVPN-Setup.exe

      - name: Снести прошлый релиз/тег этой версии (при ручном релизе)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.ver.outputs.tag }}'
          gh release delete $tag --yes --cleanup-tag 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "Релиза $tag ещё не было — нечего удалять." }
          else { Write-Host "Старый $tag убран, тег пересоздастся на текущем коммите." }
          exit 0

      - name: Создать релиз
        if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: installer\output\QarttzVPN-Setup.exe
          name: Qarttz VPN ${{ steps.ver.outputs.version }}
          body: |
            Установщик Qarttz VPN. Ядра xray и sing-box уже внутри (см. core/VERSIONS.txt).
            Запустить setup, затем кнопка «Подключить». Нужны права администратора.

      - name: Обновить канал desktop-latest (для авто-обновления)
        if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: QartzVPN Desktop (latest)
          body: Авто-обновляемый канал. Клиент берёт отсюда version.json и установщик.
          files: |
            installer\output\QarttzVPN-Setup.exe
            installer\output\version.json
